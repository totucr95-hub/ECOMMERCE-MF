<article class="product-card">
  <div class="media-wrap">
    <img [src]="product.image" [alt]="product.name" class="product-image" />
    @if (badgeLabel) {
    <span class="badge" [class.badge--discount]="hasDiscountBadge"
      >{{ badgeLabel }}</span
    >
    }
  </div>
  <h3>{{ product.name }}</h3>
  <p class="description">{{ product.description }}</p>
  <p class="price">${{ product.price }}</p>
  <div class="meta-row">
    <p class="stock">Stock: {{ product.stock }}</p>
    @if (detailLink) {
    <a class="detail-link" [routerLink]="detailLink"
      >Ver detalle <span aria-hidden="true">→</span></a
    >
    }
  </div>
  <div class="actions">
    @if (quantityInCart > 0) {
    <div class="quantity-control" aria-label="Cantidad en carrito">
      <button type="button" class="quantity-btn" (click)="onDecrease()">
        -
      </button>
      <input
        type="number"
        min="0"
        max="99"
        inputmode="numeric"
        class="quantity-input"
        [value]="quantityInputValue"
        aria-label="Cantidad"
        (input)="onQuantityInput($any($event.target).value)"
        (blur)="commitQuantity()"
        (keydown.enter)="commitQuantity()"
      />
      <button type="button" class="quantity-btn" (click)="onBuy()">+</button>
    </div>
    } @else {
    <button type="button" class="buy" (click)="onBuy()">
      Agregar al carrito
    </button>
    }
    <button
      type="button"
      class="favorite"
      [class.favorite--active]="isFavorite"
      (click)="onFavorite()"
      [attr.aria-label]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    >
      <span aria-hidden="true">★</span>
    </button>
  </div>
</article>
