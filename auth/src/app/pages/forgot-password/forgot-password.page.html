<article class="auth-card">
  <h1 class="auth-card__title">Recuperar password</h1>
  <p class="auth-card__subtitle">
    Te redirigiremos a Keycloak para iniciar el flujo de recuperacion.
  </p>

  <form class="auth-form">
    <label class="auth-form__field" for="email">
      <span>Email</span>
      <input id="email" name="email" type="email" [(ngModel)]="email" />
    </label>

    <button class="auth-form__submit" type="button" (click)="submit()">
      Continuar en Keycloak
    </button>
  </form>

  @if (errorMessage) {
  <p class="auth-card__error">{{ errorMessage }}</p>
  }

  <div class="auth-card__links">
    <a routerLink="/auth/login">Volver al login</a>
    <a routerLink="/auth/change-password">Cambiar password</a>
  </div>
</article>
