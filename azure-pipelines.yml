trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'
  DOTNET_VERSION: '10.x'
  AZURE_LOCATION: 'eastus2'
  AZURE_NAME_PREFIX: 'ecommercemf'
  APP_SERVICE_SKU: 'B1'
  DEPLOY_ENABLED: 'false'
  SONAR_ENABLED: 'false'

stages:
  - stage: ci
    displayName: Validate and analyze
    jobs:
      - job: validate
        displayName: Lint, test, build and SonarCloud
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: Use Node.js $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: UseDotNet@2
            displayName: Use .NET $(DOTNET_VERSION)
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - task: SonarCloudPrepare@3
            displayName: Prepare SonarCloud analysis
            condition: eq(variables['SONAR_ENABLED'], 'true')
            inputs:
              SonarCloud: $(SONAR_SERVICE_CONNECTION)
              organization: $(SONAR_ORGANIZATION)
              scannerMode: dotnet
              projectKey: $(SONAR_PROJECT_KEY)
              projectName: $(SONAR_PROJECT_NAME)
              extraProperties: |
                sonar.sourceEncoding=UTF-8
                sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
                sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/.angular/**,**/coverage/**,**/*.d.ts,**/webpack*.ts,**/jest.config.*
                sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts

          - script: npm ci
            displayName: Install frontend dependencies

          - script: npx nx run-many -t lint --parallel=3
            displayName: Lint Nx projects

          - script: npx nx run-many -t test --configuration=ci --parallel=3
            displayName: Test Nx projects with coverage

          - script: npx nx run-many -t build --configuration=production --parallel=3
            displayName: Build Nx projects

          - script: dotnet build backend/Ecommerce.Api.slnx --configuration Release
            displayName: Build ASP.NET API

          - task: SonarCloudAnalyze@3
            displayName: Run SonarCloud analysis
            condition: eq(variables['SONAR_ENABLED'], 'true')

          - task: SonarCloudPublish@3
            displayName: Publish SonarCloud quality gate
            condition: eq(variables['SONAR_ENABLED'], 'true')
            inputs:
              pollingTimeoutSec: '300'

  - stage: deploy_staging
    displayName: Deploy staging
    dependsOn: ci
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: staging
        displayName: Provision and deploy staging
        environment: ecommerce-mf-staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: infra/azure/deploy-environment.yml
                  parameters:
                    environment: staging
                    keycloakUrl: $(KEYCLOAK_URL_STAGING)

  - stage: deploy_production
    displayName: Deploy production
    dependsOn: deploy_staging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: production
        displayName: Provision and deploy production
        environment: ecommerce-mf-production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: infra/azure/deploy-environment.yml
                  parameters:
                    environment: production
                    keycloakUrl: $(KEYCLOAK_URL_PRODUCTION)
