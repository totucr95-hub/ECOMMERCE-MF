<header
  class="commerce-header"
  [class.commerce-header--transparent]="transparentAtTop() && !isScrolled"
>
  <div class="commerce-header__inner">
    <a
      class="commerce-header__brand"
      routerLink="/landing"
      fragment="inicio"
      (click)="closeMobileMenu()"
      aria-label="Ingecoplast, ir al inicio"
    >
      <span class="commerce-header__brand-mark" aria-hidden="true">ig</span>
      <span class="commerce-header__brand-text">
        <strong>ingecoplast</strong>
        <small>colombia</small>
      </span>
    </a>

    <nav class="commerce-header__menu" aria-label="Navegacion principal">
      <a
        class="commerce-header__menu-link"
        [class.is-active]="activeItem() === 'home'"
        routerLink="/landing"
        fragment="inicio"
        (click)="closeMobileMenu()"
        >Inicio</a
      >
      <a
        class="commerce-header__menu-link"
        [class.is-active]="activeItem() === 'wood'"
        routerLink="/landing"
        fragment="madera"
        (click)="closeMobileMenu()"
        >Madera plastica</a
      >
      <a
        class="commerce-header__menu-link"
        [class.is-active]="activeItem() === 'products'"
        routerLink="/landing"
        fragment="productos"
        (click)="closeMobileMenu()"
        >Productos</a
      >
      <a
        class="commerce-header__menu-link"
        [class.is-active]="activeItem() === 'catalog'"
        routerLink="/shop"
        (click)="closeMobileMenu()"
        >Catalogo</a
      >
    </nav>

    <div class="commerce-header__actions">
      @if (isAdmin()) {
      <a
        class="commerce-header__admin"
        routerLink="/admin"
        aria-label="Ir al panel de administracion"
        title="Panel de administracion"
      >
        <span class="commerce-header__admin-icon" aria-hidden="true">⚙</span>
      </a>
      }

      <a
        class="commerce-header__cart"
        [class.is-active]="activeItem() === 'cart'"
        [routerLink]="cartLink()"
        (click)="closeMobileMenu()"
        aria-label="Ir al carrito"
      >
        <span class="commerce-header__cart-icon" aria-hidden="true">🛒</span>
        @if (cartItemCount() > 0) {
        <span class="commerce-header__cart-badge">{{ badgeText() }}</span>
        }
      </a>

      <a
        class="commerce-header__cta"
        [class.is-active]="activeItem() === 'contact'"
        routerLink="/landing"
        fragment="contacto"
        (click)="closeMobileMenu()"
        >Contacto</a
      >

      <button
        type="button"
        class="commerce-header__mobile-toggle"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="commerce-mobile-menu"
        aria-label="Abrir menu"
        (click)="toggleMobileMenu()"
      >
        <span aria-hidden="true">{{ isMobileMenuOpen ? '×' : '☰' }}</span>
      </button>
    </div>
  </div>

  <nav
    id="commerce-mobile-menu"
    class="commerce-header__mobile-panel"
    [class.is-open]="isMobileMenuOpen"
    aria-label="Menu movil"
  >
    <a
      class="commerce-header__mobile-link"
      [class.is-active]="activeItem() === 'home'"
      routerLink="/landing"
      fragment="inicio"
      (click)="closeMobileMenu()"
      >Inicio</a
    >
    <a
      class="commerce-header__mobile-link"
      [class.is-active]="activeItem() === 'wood'"
      routerLink="/landing"
      fragment="madera"
      (click)="closeMobileMenu()"
      >Madera plastica</a
    >
    <a
      class="commerce-header__mobile-link"
      [class.is-active]="activeItem() === 'products'"
      routerLink="/landing"
      fragment="productos"
      (click)="closeMobileMenu()"
      >Productos</a
    >
    <a
      class="commerce-header__mobile-link"
      [class.is-active]="activeItem() === 'catalog'"
      routerLink="/shop"
      (click)="closeMobileMenu()"
      >Catalogo</a
    >
    <a
      class="commerce-header__mobile-link commerce-header__mobile-link--cta"
      [class.is-active]="activeItem() === 'contact'"
      routerLink="/landing"
      fragment="contacto"
      (click)="closeMobileMenu()"
      >Contacto</a
    >
  </nav>

  <button
    type="button"
    class="commerce-header__mobile-backdrop"
    [class.is-open]="isMobileMenuOpen"
    aria-label="Cerrar menu"
    (click)="closeMobileMenu()"
  ></button>
</header>
