<div class="landing">
  <lib-commerce-header [transparentAtTop]="true" />

  <app-hero-section></app-hero-section>
  <app-benefits-section></app-benefits-section>
  <app-featured-section
    [featuredProducts]="featuredProducts"
  ></app-featured-section>
  <app-contact-section></app-contact-section>

  <lib-commerce-footer />

  @if (showLocalLoader && loading.isLoading()) {
  <div
    class="landing-loader"
    role="status"
    aria-live="polite"
    aria-label="Cargando contenido"
  >
    <div class="landing-loader__panel">
      <span class="landing-loader__spinner" aria-hidden="true"></span>
      <p>Cargando...</p>
    </div>
  </div>
  }
</div>
