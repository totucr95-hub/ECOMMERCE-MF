sonar.projectName=ecommerce-mf
sonar.sourceEncoding=UTF-8

# Monorepo roots
sonar.sources=.

# Test and coverage handling
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# Exclusions for generated/build/vendor assets
sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/.angular/**,**/coverage/**,**/*.d.ts,**/webpack*.ts,**/jest.config.*

# Keep CPD focused on source code
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts
