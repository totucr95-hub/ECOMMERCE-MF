<article class="auth-card">
  <h1 class="auth-card__title">Crear cuenta</h1>
  <p class="auth-card__subtitle">
    Completa el registro directamente en Keycloak.
  </p>

  <button class="auth-form__submit" type="button" (click)="submit()">
    Registrarme en Keycloak
  </button>

  @if (errorMessage) {
  <p class="auth-card__error">{{ errorMessage }}</p>
  }

  <div class="auth-card__links">
    <a routerLink="/auth/login">Ya tengo cuenta</a>
    <a routerLink="/auth/forgot-password">Recuperar password</a>
  </div>
</article>
