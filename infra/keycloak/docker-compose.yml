services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ecommerce-mf-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./realm-ecommerce-mf.json:/opt/keycloak/data/import/realm-ecommerce-mf.json:ro
