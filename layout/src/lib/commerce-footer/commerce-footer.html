<footer class="commerce-footer">
  <div class="commerce-footer__inner">
    <div class="commerce-footer__brand">
      <div class="commerce-footer__logo" aria-hidden="true">ig</div>
      <div>
        <strong>ingecoplast</strong>
        <p class="commerce-footer__description">
          Ingecoplast Colombia transforma plastico reciclado en soluciones de
          madera plastica durables para construccion, mobiliario y exteriores.
        </p>
      </div>
    </div>

    <nav class="commerce-footer__menu" aria-label="Navegacion secundaria">
      <a
        class="commerce-footer__menu-link"
        routerLink="/landing"
        fragment="inicio"
        >Inicio</a
      >
      <a
        class="commerce-footer__menu-link"
        routerLink="/landing"
        fragment="madera"
        >Madera plastica</a
      >
      <a
        class="commerce-footer__menu-link"
        [routerLink]="productsRoute()"
        [fragment]="productsFragment()"
        >Productos</a
      >
      <a
        class="commerce-footer__menu-link"
        routerLink="/landing"
        fragment="contacto"
        >Contacto</a
      >
    </nav>
  </div>
</footer>
