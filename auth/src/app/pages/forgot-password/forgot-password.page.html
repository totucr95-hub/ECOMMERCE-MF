<article class="auth-card">
  <h1 class="auth-card__title">Recuperar password</h1>
  <p class="auth-card__subtitle">Ingresa tu correo para recuperar acceso.</p>

  <form class="auth-form">
    <label class="auth-form__field" for="email">
      <span>Email</span>
      <input id="email" name="email" type="email" />
    </label>

    <button class="auth-form__submit" type="button">Enviar enlace</button>
  </form>

  <div class="auth-card__links">
    <a routerLink="/auth/login">Volver al login</a>
    <a routerLink="/auth/register">Crear cuenta</a>
  </div>
</article>
